<!-- tela de gestao de pessoas -->
<div class="min-h-screen flex bg-white overflow-x-hidden">
  <app-sidebar paginaAtiva="pessoas"></app-sidebar>

  <!-- conteúdo principal -->
  <main
    class="flex-1 min-w-0 min-h-screen bg-white px-10 py-8 xl:px-[68px] xl:py-[36px]"
  >
    <!-- cabeçalho da página -->
    <header class="mb-5">
      <p class="text-[10px] tracking-[4px] text-black mb-1">
        GESTÃO
      </p>

      <h1 class="text-[20px] font-bold text-black leading-tight">
        Gestão de Pessoas
      </h1>

      <p class="text-[13px] text-black mt-2">
        Acompanhe e gerencie todos os membros da empresa!
      </p>
    </header>

    <!-- container de pessoas -->
    <section
      class="w-full min-w-0 bg-[#e5e7e9] rounded-[14px] p-[18px]"
    >
      <!-- ações principais -->
      <div
        class="w-full min-w-0 flex items-center gap-2.5 mb-4"
      >
        <!-- barra de pesquisa -->
        <div class="flex flex-1 min-w-0 h-[41px]">
          <input
            type="text"
            [(ngModel)]="termoBusca"
            (ngModelChange)="pesquisar()"
            placeholder="Pesquise o nome do membro"
            class="flex-1 min-w-0 rounded-l-lg bg-white/80 px-4 text-[11px] text-black placeholder:text-gray-400 outline-none"
          />

          <button
            type="button"
            (click)="pesquisar()"
            class="w-[54px] shrink-0 flex items-center justify-center rounded-r-lg bg-[#d1d3d5]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              class="w-4 h-4 text-black"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
          </button>
        </div>

        <!-- legenda de cargos -->
        <div class="flex items-center gap-4 whitespace-nowrap">
          <span class="flex items-center gap-1.5 text-[11px] text-black">
            <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
            Diretores
          </span>

          <span class="flex items-center gap-1.5 text-[11px] text-black">
            <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
            Gerentes
          </span>

          <span class="flex items-center gap-1.5 text-[11px] text-black">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            Membros
          </span>
        </div>
      </div>

      <!-- lista de membros -->
      <div class="overflow-x-auto w-full">
        <div class="w-full min-w-[750px]">

          <!-- cabeçalho da tabela -->
          <div
            class="w-full
                   grid
                   grid-cols-[minmax(0,2fr)_minmax(0,1.2fr)_minmax(0,1.3fr)_minmax(0,1fr)_78px]
                   gap-x-3
                   items-center
                   px-4
                   py-[9px]
                   bg-white/70
                   rounded-lg"
          >
            <span class="text-[11px] font-semibold">
              Nome do membro
            </span>

            <span class="text-[11px] font-semibold">
              Cargo
            </span>

            <span class="text-[11px] font-semibold">
              Área
            </span>

            <span class="text-[11px] font-semibold">
              Status
            </span>

            <span class="text-[11px] font-semibold text-center">
              Ações
            </span>
          </div>

          <!-- estado carregando -->
          <div
            *ngIf="carregando"
            class="px-4 py-6 text-[11px] text-black/50"
          >
            Carregando membros...
          </div>

          <!-- estado vazio -->
          <div
            *ngIf="!carregando && membros.length === 0"
            class="py-10 text-center text-[11px] text-black/50"
          >
            Nenhum membro encontrado.
          </div>

          <!-- membros -->
          <div
            *ngFor="let membro of membros; trackBy: trackPorId"
            class="w-full
                   grid
                   grid-cols-[minmax(0,2fr)_minmax(0,1.2fr)_minmax(0,1.3fr)_minmax(0,1fr)_78px]
                   gap-x-3
                   items-center
                   px-4
                   py-3"
          >

            <!-- nome com barrinha colorida por cargo -->
            <div class="flex items-center gap-3 min-w-0">
              <div
                class="w-[2px] h-[30px] rounded-full shrink-0"
                [ngClass]="corBarra(membro.role)"
              ></div>

              <span
                class="text-[11px] font-medium truncate min-w-0"
              >
                {{ membro.name }}
              </span>
            </div>

            <!-- cargo -->
            <span
              *ngIf="membroEmEdicaoId !== membro.id"
              class="text-[11px] font-medium min-w-0"
              [ngClass]="corRole(membro.role)"
            >
              {{ membro.role }}
            </span>

            <select
              *ngIf="membroEmEdicaoId === membro.id"
              [(ngModel)]="roleEmEdicao"
              class="text-[11px]
                     rounded-lg
                     border
                     border-black/10
                     px-2
                     py-1
                     w-full
                     max-w-[150px]
                     bg-white
                     outline-none"
            >
              <option
                *ngFor="let role of rolesDisponiveis"
                [value]="role"
              >
                {{ role }}
              </option>
            </select>

            <!-- área -->
            <span
              *ngIf="membroEmEdicaoId !== membro.id"
              class="text-[11px] truncate min-w-0"
            >
              {{ membro.area || '—' }}
            </span>

            <input
              *ngIf="membroEmEdicaoId === membro.id"
              type="text"
              [(ngModel)]="areaEmEdicao"
              placeholder="Área"
              class="text-[11px]
                     rounded-lg
                     border
                     border-black/10
                     px-2
                     py-1
                     w-full
                     max-w-[150px]
                     bg-white
                     outline-none"
            />

            <!-- status -->
            <button
              type="button"
              (click)="alternarStatus(membro)"
              [disabled]="!podeEditar || membroEmEdicaoId !== membro.id"
              [title]="
                membroEmEdicaoId === membro.id
                  ? 'Clique para alternar'
                  : 'Clique em editar para alterar o status'
              "
              class="text-[11px]
                     font-medium
                     w-fit
                     disabled:cursor-default
                     disabled:opacity-100"
              [ngClass]="
                statusEfetivo(membro) === 'Ativo'
                  ? 'text-green-600'
                  : 'text-red-500'
              "
            >
              {{ statusEfetivo(membro) }}
            </button>

            <!-- ações -->
            <div class="flex items-center justify-center gap-2">

              <ng-container *ngIf="podeEditar">

                <!-- modo normal -->
                <ng-container *ngIf="membroEmEdicaoId !== membro.id">

                  <!-- editar -->
                  <button
                    type="button"
                    (click)="editarMembro(membro)"
                    title="Editar membro"
                    class="w-[27px]
                           h-[27px]
                           shrink-0
                           rounded-[8px]
                           border
                           border-[#d4d6d8]
                           flex
                           items-center
                           justify-center
                           hover:bg-white/60
                           transition"
                  >
                    <img
                      src="/assets/icons/editar.png"
                      alt="Editar membro"
                      class="w-[13px] h-[13px]"
                    />
                  </button>

                  <!-- desativar -->
                  <button
                    type="button"
                    (click)="removerMembro(membro)"
                    [disabled]="statusEfetivo(membro) === 'Inativo'"
                    [title]="
                      statusEfetivo(membro) === 'Inativo'
                        ? 'Já está inativo'
                        : 'Desativar membro'
                    "
                    class="w-[27px]
                           h-[27px]
                           shrink-0
                           rounded-[8px]
                           border
                           border-[#d4d6d8]
                           flex
                           items-center
                           justify-center
                           hover:bg-white/60
                           transition
                           disabled:opacity-30
                           disabled:hover:opacity-30"
                  >
                    <img
                      src="/assets/icons/lixeira.png"
                      alt="Desativar membro"
                      class="w-[13px] h-[13px]"
                    />
                  </button>

                </ng-container>

                <!-- modo edição -->
                <ng-container *ngIf="membroEmEdicaoId === membro.id">

                  <!-- salvar -->
                  <button
                    type="button"
                    (click)="salvarEdicao(membro)"
                    title="Salvar"
                    class="w-[27px]
                           h-[27px]
                           shrink-0
                           rounded-[8px]
                           border
                           border-[#d4d6d8]
                           flex
                           items-center
                           justify-center
                           hover:bg-white/60
                           transition"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      class="w-[13px] h-[13px]"
                    >
                      <path d="M20 6 9 17l-5-5" />
                    </svg>
                  </button>

                  <!-- cancelar -->
                  <button
                    type="button"
                    (click)="cancelarEdicao()"
                    title="Cancelar"
                    class="w-[27px]
                           h-[27px]
                           shrink-0
                           rounded-[8px]
                           border
                           border-[#d4d6d8]
                           flex
                           items-center
                           justify-center
                           hover:bg-white/60
                           transition"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      class="w-[13px] h-[13px]"
                    >
                      <path d="M18 6 6 18" />
                      <path d="M6 6l12 12" />
                    </svg>
                  </button>

                </ng-container>

              </ng-container>

            </div>

          </div>

        </div>
      </div>

    </section>

  </main>
</div>
