<!--tela de Cadastro-->
<div class="login-container min-h-screen flex flex-col justify-between px-8 py-6 md:px-16 md:py-10">

  <header class="flex items-start justify-between mb-10">
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-1.5">
        <img
          src="/icons/logo-ofc.png"
          alt="Logo AsiApp"
          class="w-6 h-6"
        >
        <h1 class="text-sm font-bold text-white leading-tight">AsiApp</h1>
      </div>
      <p class="text-[10px] text-white/90 leading-tight">
        Um aplicativo de Asimembros<br>para Asimembros
      </p>
    </div>
    <span class="text-sm font-semibold text-white">AsimovJr.</span>
  </header>

  <!--conteudo principal: formulario de cadastro-->
  <main class="flex-1 flex items-center justify-center">
    <div class="w-[260px] flex flex-col items-center text-center">

      <img
        src="/icons/logo-asiapp.svg"
        alt="Logo AsiApp"
        class="w-20 h-20 mb-3"
      >

      <p class="text-white text-sm mb-1">Bem vindo!</p>
      <h2 class="text-white text-base font-medium mb-5">Faça Cadastro para continuar</h2>

      <!--formulario de cadastro-->
      <form class="w-full flex flex-col gap-1" novalidate>

        <div class="text-left">
          <input
            type="text"
            placeholder="Nome"
            class="w-full px-3 py-2 rounded-md bg-white/30 backdrop-blur-sm text-white placeholder-white/80 text-xs outline-none focus:bg-white/40 transition"
          >
        </div>

        <div class="text-left mt-2">
          <input
            type="email"
            placeholder="Email"
            class="w-full px-3 py-2 rounded-md bg-white/30 backdrop-blur-sm text-white placeholder-white/80 text-xs outline-none focus:bg-white/40 transition"
          >
        </div>

        <div class="text-left mt-2">
          <input
            type="password"
            placeholder="Senha"
            class="w-full px-3 py-2 rounded-md bg-white/30 backdrop-blur-sm text-white placeholder-white/80 text-xs outline-none focus:bg-white/40 transition"
          >
        </div>

        <div class="text-left mt-2">
          <input
            type="password"
            placeholder="Confirmar senha"
            class="w-full px-3 py-2 rounded-md bg-white/30 backdrop-blur-sm text-white placeholder-white/80 text-xs outline-none focus:bg-white/40 transition"
          >
        </div>

        <!--botao principal de envio do cadastro-->
        <button
          type="submit"
          class="w-full py-2 rounded-md font-semibold text-white text-xs bg-asi-dark hover:bg-black transition mt-3 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cadastrar
        </button>

        <p class="text-white text-[10px] whitespace-nowrap">
          Já possui uma conta?
          <a routerLink="/" class="font-semibold hover:underline">Faça seu Login!</a>
        </p>

      </form>
    </div>
  </main>

  <div></div>
</div>
