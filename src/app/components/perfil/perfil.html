<div class="flex min-h-screen bg-[#eef1f4]">
  <app-sidebar></app-sidebar>

  <main class="flex-1 flex items-center justify-center p-10">
    <div class="bg-white rounded-[28px] shadow-[0_8px_30px_rgba(15,23,42,0.06)] p-10 w-full max-w-xl">

      <!-- Título -->
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-lg font-bold text-asi-dark">Seu Perfil</h2>

        <button
          *ngIf="!modoEdicao"
          type="button"
          (click)="alternarEdicao()"
          class="text-[11px] font-semibold text-asi-blue hover:underline"
        >
          Editar Perfil
        </button>
      </div>

      <!-- Avatar -->
      <div class="relative w-32 h-32 mx-auto mb-10">
        <img
          [src]="usuario?.fotoUrl || 'assets/icons/icone-perfil.png'"
          alt="Foto de perfil"
          class="w-32 h-32 rounded-full object-cover border border-asi-dark/20"
        />

        <label
          *ngIf="modoEdicao"
          class="absolute -top-1 -right-1 w-8 h-8 bg-white rounded-full border border-gray-200 shadow-sm flex items-center justify-center cursor-pointer hover:bg-gray-50 transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-3.5 h-3.5 text-asi-dark">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>

          <input type="file" accept="image/*" class="hidden" (change)="onFotoSelecionada($event)" />
        </label>
      </div>

      <!-- Formulário -->
      <form [formGroup]="perfilForm" (ngSubmit)="salvarPerfil()" class="flex flex-col gap-6">

        <!-- NOME DE USUÁRIO -->
        <div class="flex items-center gap-6">
          <label class="w-32 shrink-0 text-xs font-bold text-asi-dark">Nome de Usuário:</label>

          <input
            formControlName="nome"
            type="text"
            placeholder="{{ usuario?.name }}"
            [readonly]="!modoEdicao"
            class="flex-1 max-w-[280px] h-[38px] rounded-full border border-gray-200 px-4 text-xs bg-gray-50 outline-none focus:bg-white focus:border-asi-blue transition"
          />
        </div>

        <!-- SENHA - VISUALIZAÇÃO -->
        <div *ngIf="!modoEdicao" class="flex items-center gap-6">
          <label class="w-32 shrink-0 text-xs font-bold text-asi-dark">Senha:</label>

          <div class="relative flex-1 max-w-[280px]">
            <input
              type="password"
              value="••••••••••••"
              readonly
              class="w-full h-[38px] rounded-full border border-gray-200 px-4 pr-11 text-xs bg-gray-50 outline-none"
            />

            <button
              type="button"
              disabled
              title="Disponível apenas no modo de edição"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 cursor-not-allowed"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <!-- SENHA - MODO EDIÇÃO -->
        <div *ngIf="modoEdicao" [formGroup]="senhaForm" class="flex flex-col gap-5">

          <!-- Senha atual -->
          <div class="flex items-center gap-6">
            <label class="w-32 shrink-0 text-xs font-bold text-asi-dark">Senha atual:</label>

            <div class="relative flex-1 max-w-[280px]">
              <input
                formControlName="senhaAtual"
                [type]="mostrarSenha ? 'text' : 'password'"
                placeholder="Senha atual"
                class="w-full h-[38px] rounded-full border border-gray-200 px-4 pr-11 text-xs bg-gray-50 outline-none focus:bg-white focus:border-asi-blue transition"
              />

              <button
                type="button"
                (click)="toggleSenha()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-asi-dark transition"
              >
                <svg *ngIf="!mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>

                <svg *ngIf="mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06" />
                  <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.61 3.68" />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Nova senha -->
          <div class="flex items-center gap-6">
            <label class="w-32 shrink-0 text-xs font-bold text-asi-dark">Nova senha:</label>

            <input
              formControlName="novaSenha"
              [type]="mostrarSenha ? 'text' : 'password'"
              placeholder="Nova senha"
              class="flex-1 max-w-[280px] h-[38px] rounded-full border border-gray-200 px-4 text-xs bg-gray-50 outline-none focus:bg-white focus:border-asi-blue transition"
            />
          </div>
        </div>

        <!-- CARGO -->
        <div class="flex items-center gap-6">
          <label class="w-32 shrink-0 text-xs font-bold text-asi-dark">Cargo:</label>
          <p class="text-xs text-gray-500 font-medium">"{{ usuario?.role }}"</p>
        </div>

        <!-- BOTÕES: Cancelar + Salvar, lado a lado -->
        <div *ngIf="modoEdicao" class="flex justify-end gap-3 mt-3">
          <button
            type="button"
            (click)="alternarEdicao()"
            class="py-2 px-6 rounded-2xl font-semibold text-xs text-gray-400 bg-gray-100 hover:bg-gray-200 transition"
          >
            Cancelar
          </button>

          <button
            type="submit"
            [disabled]="carregando"
            class="py-2 px-6 rounded-2xl font-semibold text-white text-xs bg-gradient-to-r from-[#168be8] to-[#00365f] hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ carregando ? 'Salvando...' : 'Salvar' }}
          </button>
        </div>

        <!-- MENSAGENS -->
        @if (mensagemSucesso) {
          <p class="text-green-600 text-xs text-center">{{ mensagemSucesso }}</p>
        }

        @if (mensagemErro) {
          <p class="text-red-600 text-xs text-center">{{ mensagemErro }}</p>
        }

      </form>
    </div>
  </main>
</div>
