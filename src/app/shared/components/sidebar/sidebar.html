<!--menu lateral do sistema-->
<aside
  class="sidebar-container
         flex
         flex-col
         px-8
         py-10
         text-white"
>


  <!--identidade do AsiApp-->
  <div
    class="flex flex-col gap-1"
  >

    <div
      class="flex items-center gap-2"
    >

      <img
        src="assets/icons/logo-ofc.png"
        alt="Logo AsiApp"
        class="w-7 h-7"
      >


      <h1
        class="text-[16px] font-bold leading-tight"
      >
        AsiApp
      </h1>

    </div>


    <p
      class="text-[9px] text-white/90 leading-tight"
    >
      Um aplicativo de Asimembros<br>
      para Asimembros
    </p>

  </div>


  <!--navegacao-->
  <nav class="mt-8">


    <!--home-->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Home
    </div>


    <!--gestao de pessoas-->
    <div
      class="menu-item cursor-pointer"
      [class.ativo]="paginaAtiva === 'pessoas'"
      (click)="navegar('/pessoas')"
    >
      Gestão de Pessoas
    </div>


    <!--gestao de projetos-->
    <div
      class="menu-item cursor-pointer"
      [class.ativo]="paginaAtiva === 'projetos'"
      (click)="navegar('/projetos')"
    >
      Gestão de Projetos
    </div>


    <!--gestao financeira-->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Gestão Financeira
    </div>


    <!--menu de postagem-->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Menu de Postagem
    </div>

  </nav>


  <!--perfil e logout-->
  <div
    class="mt-auto flex flex-col gap-4"
  >


    <!--perfil do usuario-->
    <div
      class="flex items-center gap-2.5 cursor-pointer"
      (click)="navegar('/perfil')"
    >

      <img
        [src]="usuario()?.photoUrl || 'assets/icons/icone-perfil.png'"
        alt="Foto de perfil"
        class="w-9 h-9 rounded-full object-cover shrink-0"
      >


      <p
        class="text-[10px] leading-tight text-white truncate"
      >
        {{ usuario()?.name || 'Usuário' }}
      </p>

    </div>


    <!--sair-->
    <button
      type="button"
      (click)="logout()"
      class="w-full
             flex
             items-center
             gap-3
             pt-3
             border-t
             border-white/20
             text-white/70
             hover:text-white
             transition
             cursor-pointer"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15"
        />

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M18 15l3-3m0 0l-3-3m3 3H9"
        />
      </svg>


      <span
        class="text-[11px]"
      >
        Sair
      </span>

    </button>

  </div>

</aside>
