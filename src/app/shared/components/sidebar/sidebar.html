<!-- menu lateral do sistema -->
<aside class="sidebar-container w-[250px] h-full flex flex-col px-10 py-12 text-white shrink-0 self-stretch">

  <!-- identidade do AsiApp -->
  <div class="flex flex-col gap-1">

    <div class="flex items-center gap-2">
      <img
        src="assets/icons/logo-ofc.png"
        alt="Logo AsiApp"
        class="w-7 h-7"
      >

      <h1 class="text-[17px] font-bold leading-tight">
        AsiApp
      </h1>
    </div>

    <p class="text-[10px] text-white/90 leading-tight">
      Um aplicativo de Asimembros<br>
      para Asimembros
    </p>

  </div>

 <!-- BOTÕES DESABILITADOS NOS COMPONENTES SEM TELAS, VOU ATUALIZAR DPS -->

  <!-- navegação principal -->
  <nav class="mt-9">

    <!-- Home -->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Home
    </div>

    <!-- Gestão de Pessoas -->
    <div
      class="menu-item cursor-pointer"
      [class.ativo]="paginaAtiva === 'projetos'"
      (click)="navegar('pessoas')"
    >
      Gestão de Pessoas
    </div>

    <!-- Gestão de Projetos -->
    <div
      class="menu-item cursor-pointer"
      [class.ativo]="paginaAtiva === 'projetos'"
      (click)="navegar('projetos')"
    >
      Gestão de Projetos
    </div>

    <!-- Gestão Financeira -->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Gestão Financeira
    </div>

    <!-- Menu de Postagem -->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Menu de Postagem
    </div>

  </nav>


<!-- perfil e logout -->
<div class="mt-auto flex flex-col gap-4">

  <!-- perfil do usuário -->
  <div
    class="flex items-center gap-3 cursor-pointer"
    (click)="navegar('perfil')"
  >

    <img
      [src]="usuario?.fotoUrl || 'assets/icons/logo-asiapp.svg'"
      alt="Foto de perfil"
      class="w-10 h-10 rounded-full object-cover"
    >

    <p class="text-[11px] leading-relaxed">
      {{ usuario?.name || 'Usuário' }}
    </p>

  </div>

  <!-- botão sair -->
  <button
    type="button"
    (click)="logout()"
    class="w-full flex items-center gap-3 pt-3 border-t border-white/20 text-white/70 hover:text-white transition cursor-pointer"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15"
      />
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M18 15l3-3m0 0l-3-3m3 3H9"
      />
    </svg>

    <span class="text-[11px]">
      Sair
    </span>
  </button>

</div>
