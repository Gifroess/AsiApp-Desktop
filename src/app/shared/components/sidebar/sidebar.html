<!--menu lateral do sistema-->
<aside class="sidebar-container w-[250px] min-h-screen flex flex-col px-10 py-12 text-white shrink-0">

  <!--identidade do AsiApp-->
  <div class="flex flex-col gap-1">

    <div class="flex items-center gap-2">
      <img
        src="/icons/logo-ofc.png"
        alt="Logo AsiApp"
        class="w-7 h-7"
      >

      <h1 class="text-[17px] font-bold leading-tight">
        AsiApp
      </h1>
    </div>

    <p class="text-[10px] text-white/90 leading-tight">
      Um aplicativo de Asimembros<br>
      para Asimembros
    </p>

  </div>


  <!--navegacao principal-->
  <nav class="mt-9">

    <a
      class="menu-item"
      routerLink="/home"
      [class.ativo]="paginaAtiva === 'home'"
    >
      Home
    </a>

    <!--sem tela ainda-->
    <div
      class="menu-item menu-item--desativado"
      [class.ativo]="paginaAtiva === 'pessoas'"
    >
      Gestão de Pessoas
    </div>

    <a
      class="menu-item"
      routerLink="/gestao-projetos"
      [class.ativo]="paginaAtiva === 'projetos'"
    >
      Gestão de Projetos
    </a>

    <!--sem tela ainda-->
    <div
      class="menu-item menu-item--desativado"
      [class.ativo]="paginaAtiva === 'financeiro'"
    >
      Gestão Financeira
    </div>

    <!--sem tela ainda-->
    <div
      class="menu-item menu-item--desativado"
      [class.ativo]="paginaAtiva === 'postagens'"
    >
      Menu de Postagem
    </div>

  </nav>


  <!--perfil do usuario-->
  <a class="mt-auto flex items-center gap-3" routerLink="/perfil">

    <img
      src="/icons/logo-asiapp.svg"
      alt="Perfil"
      class="w-10 h-10"
    >

    <p class="text-[11px] leading-relaxed">
      “Nome do<br>
      perfil”
    </p>

  </a>

</aside>
