<!-- menu lateral do sistema -->
<aside
  class="sidebar-container
         flex
         flex-col
         px-8
         py-10
         text-white"
>


  <!-- identidade do AsiApp -->
  <div class="flex flex-col gap-1">

    <div class="flex items-center gap-2">

      <img
        src="assets/icons/logo-ofc.png"
        alt="Logo AsiApp"
        class="w-7 h-7"
      >

      <h1
        class="text-[16px] font-bold leading-tight"
      >
        AsiApp
      </h1>

    </div>


    <p
      class="text-[9px] text-white/90 leading-tight"
    >
      Um aplicativo de Asimembros<br>
      para Asimembros
    </p>

  </div>


  <!--navegacao-->
  <nav class="mt-8">


    <!--home-->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Home
    </div>


    <!--gestao de pessoas-->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Gestão de Pessoas
    </div>


    <!--gestao de projetos-->
    <div
      class="menu-item cursor-pointer"
      [class.ativo]="paginaAtiva === 'projetos'"
      (click)="navegar('/projetos')"
    >
      Gestão de Projetos
    </div>


    <!--gestao financeira-->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Gestão Financeira
    </div>


    <!--menu de postagem-->
    <div
      class="menu-item opacity-50 cursor-not-allowed"
    >
      Menu de Postagem
    </div>

  </nav>


  <!--perfil-->
  <div
    class="mt-auto flex items-center gap-2.5 cursor-pointer"
    (click)="navegar('/perfil')"
  >

    <img
      [src]="usuario()?.photoUrl || 'assets/icons/icone-perfil.png'"
      alt="Foto de perfil"
      class="w-9 h-9 rounded-full object-cover shrink-0"
    >


    <p
      class="text-[10px] leading-tight text-white truncate"
    >
      {{ usuario()?.name || 'Usuário' }}
    </p>

  </div>

</aside>
